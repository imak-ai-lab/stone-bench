[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stone-bench"
version = "0.1.0"
description = "StoneBench paper companion: lightweight detection demo and granulometric evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
yolo = [
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "ultralytics==8.4.135",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
